<svg xmlns="http://www.w3.org/2000/svg" width="824" height="452" viewBox="0 0 824 452" role="img" aria-labelledby="title desc">
  <title id="title">DrowseOff reference hardware and placement</title>
  <desc id="desc">Place the ESP32 and LD2410C in a bedside enclosure facing the bed. Run Docker on an always-on computer on the same LAN. Put the BroadLink RM Mini in sight of the TV. An optional Shelly plug at the TV outlet can measure standby power.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .heading { fill: #192e35; font-size: 22px; font-weight: 650; }
      .copy { fill: #394f52; font-size: 16px; }
      .place { fill: #246b63; font-size: 15px; font-weight: 650; }
      .edge { stroke: #203d40; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
      .hair { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    </style>
    <pattern id="vents" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M2 1v3" stroke="#557271" stroke-width="1.8" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="824" height="452" rx="18" fill="#f6f3e9"/>
  <text x="32" y="49" fill="#192e35" font-size="32" font-weight="650">Example setup with a network IR hub</text>
  <path d="M32 70h760M32 251h760M410 88v143m0 40v154" fill="none" stroke="#c9cec2" stroke-width="1.5"/>

  <!-- Bedside enclosure with the controller and radar boards shown separately. -->
  <g transform="translate(39 106)">
    <ellipse cx="77" cy="99" rx="62" ry="9" fill="#d9ddd0"/>
    <g class="edge">
      <path d="m7 55 62-22 55 22-63 24z" fill="#ecece1"/>
      <path d="m7 55 54 24v27L7 82z" fill="#c2cbbe"/>
      <path d="m61 79 63-24v28l-63 23z" fill="#a6b7a9"/>
      <path d="m15 55 54-18 44 18-52 19z" fill="#94a89b"/>
    </g>
    <path d="m79 82 25-10m-25 15 25-10" class="hair" stroke="#566c62"/>
    <g transform="rotate(-12 58 40)" class="edge">
      <rect x="35" y="3" width="38" height="68" rx="4" fill="#315751"/>
      <path d="M40 8h28v12H40z" fill="#b09757" stroke="none"/>
      <path d="M41 16v-5h5v5h5v-5h5v5h6v-5h5" class="hair" stroke="#f1dc9e"/>
      <rect x="42" y="24" width="25" height="25" rx="2" fill="#cccebf"/>
      <g stroke="#e9c979" stroke-width="3" stroke-dasharray="2 5">
        <path d="M37 25v33m34-33v33"/>
      </g>
      <rect x="47" y="60" width="15" height="10" rx="2" fill="#dbe0d4"/>
    </g>
    <g transform="rotate(12 99 37)" class="edge">
      <rect x="89" y="13" width="19" height="48" rx="2" fill="#256d61"/>
      <path d="m93 21 4-3 4 3-4 3zm0 10 4-3 4 3-4 3zm0 10 4-3 4 3-4 3" fill="#d9bb78" stroke="none"/>
      <path d="M92 59v6m4-6v6m4-6v6m4-6v6" stroke="#b59455"/>
    </g>
  </g>
  <text x="185" y="127" class="place">Beside the bed</text>
  <text x="185" y="160" class="heading">ESP32 + LD2410C</text>
  <text x="185" y="187" class="copy">Aim the enclosed radar</text>
  <text x="185" y="209" class="copy">toward your torso.</text>

  <!-- Always-on host, with vents, USB ports and a power button. -->
  <g transform="translate(432 109)">
    <ellipse cx="75" cy="91" rx="64" ry="10" fill="#d9ddd0"/>
    <g class="edge">
      <path d="m11 48 33-27 88 14-31 27z" fill="#a9bdb7"/>
      <path d="m11 48 90 14v30L11 78z" fill="#506e70"/>
      <path d="m101 62 31-27v30l-31 27z" fill="#345254"/>
      <path d="m25 54 61 10v15l-61-10z" fill="url(#vents)" stroke="none"/>
      <path d="m107 65 9-8v4l-9 8zm12-10 8-7v4l-8 7z" fill="#152c33" stroke="none"/>
      <path d="m36 43 15-12 57 9-15 12z" fill="#bacec5" stroke="none"/>
    </g>
    <circle cx="92" cy="77" r="3" fill="#a4e8ce"/>
  </g>
  <text x="583" y="127" class="place">On the home network</text>
  <text x="583" y="160" class="heading">Docker host</text>
  <text x="583" y="187" class="copy">An always-on computer</text>
  <text x="583" y="209" class="copy">runs the API and dashboard.</text>

  <!-- IR hub in front of a TV. -->
  <g transform="translate(39 286)">
    <ellipse cx="77" cy="100" rx="64" ry="10" fill="#d9ddd0"/>
    <g class="edge">
      <path d="m47 9 82 12v55l-82-12z" fill="#273e47"/>
      <path d="m52 15 72 10v44L52 59z" fill="#425b63" stroke="none"/>
      <path d="m88 71 1 10m-15 2 28 4" fill="none" stroke-width="3"/>
      <path d="M14 67v21c0 16 47 16 47 0V67" fill="#354b52"/>
      <ellipse cx="37.5" cy="67" rx="23.5" ry="8" fill="#586d6e"/>
      <path d="M20 92q17 8 35 1" class="hair" stroke="#77918b"/>
    </g>
    <circle cx="37" cy="85" r="2" fill="#99d8c6"/>
    <circle cx="121" cy="71" r="1.6" fill="#edaf60"/>
  </g>
  <text x="185" y="310" class="place">Near the TV</text>
  <text x="185" y="343" class="heading">BroadLink RM Mini</text>
  <text x="185" y="370" class="copy">Give the hub a clear path</text>
  <text x="185" y="392" class="copy">to the TV's IR receiver.</text>

  <!-- Socket face and pins distinguish the optional meter from an IR hub. -->
  <g transform="translate(443 289) rotate(-12 64 58)">
    <path d="M65 80v28m17-26v26" stroke="#546962" stroke-width="6" stroke-linecap="round"/>
    <g class="edge">
      <path d="M29 35c0-29 70-29 70 0v39c0 32-70 32-70 0z" fill="#d3d9cc"/>
      <ellipse cx="64" cy="35" rx="35" ry="25" fill="#f0eee1"/>
      <ellipse cx="64" cy="35" rx="25" ry="17" fill="#b5c4b8"/>
      <path d="M42 35c6-15 32-20 45-7" class="hair" stroke="#748c80"/>
      <ellipse cx="55" cy="36" rx="3.2" ry="3.5" fill="#324d49" stroke="none"/>
      <ellipse cx="73" cy="36" rx="3.2" ry="3.5" fill="#324d49" stroke="none"/>
      <path d="M32 68q30 22 64 0" class="hair" stroke="#92a498"/>
    </g>
    <circle cx="62" cy="77" r="2.8" fill="#9a602c"/>
  </g>
  <text x="583" y="310" fill="#865024" font-size="15" font-weight="650">At the TV outlet · optional</text>
  <text x="583" y="343" class="heading">Shelly Plug</text>
  <text x="583" y="370" class="copy">Checks for standby by</text>
  <text x="583" y="392" class="copy">measuring the TV's watts.</text>
</svg>
