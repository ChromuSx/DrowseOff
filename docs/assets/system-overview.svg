<svg xmlns="http://www.w3.org/2000/svg" width="824" height="360" viewBox="0 0 824 360" role="img" aria-labelledby="title desc">
  <title id="title">How the TV OFF command travels in the network hub setup</title>
  <desc id="desc">The ESP32 scores stillness using the LD2410C radar and sends a threshold event over Wi-Fi to the home server. In Auto mode the server asks the BroadLink hub over the LAN to send a learned infrared OFF command to the TV. An optional Shelly meter reports the TV's power draw to the server.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .name { fill: #f2f5ef; font-size: 22px; font-weight: 650; }
      .detail { fill: #c0d2d7; font-size: 16px; }
      .type { fill: #a2e2d6; font-size: 16px; font-weight: 600; }
      .trace { fill: none; stroke: #91dace; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .icon { stroke: #aadbd5; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="0.85" fill="#35565e"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto">
      <path d="m1 1 7 4-7 4" fill="none" stroke="#91dace" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="m1 1 7 4-7 4" fill="none" stroke="#efb876" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="824" height="360" rx="18" fill="#112431"/>
  <text x="32" y="49" fill="#f2f5ef" font-size="32" font-weight="650">TV OFF with a network IR hub</text>
  <path d="M32 69h760" stroke="#3b515b"/>
  <rect x="32" y="82" width="760" height="93" fill="url(#dots)"/>

  <!-- The solid route reads left to right. Each label belongs to one hop. -->
  <g text-anchor="middle" class="type">
    <text x="201" y="113">Wi-Fi</text>
    <text x="414" y="113">LAN</text>
    <text x="614" y="113">Infrared</text>
  </g>
  <g class="trace" marker-end="url(#arrow)">
    <path d="M152 139h98"/>
    <path d="M360 139h102"/>
    <path d="M566 139h93"/>
  </g>

  <!-- Bedside radar module, server, IR hub, then the receiving TV. -->
  <g class="icon">
    <rect x="68" y="108" width="51" height="51" rx="8" fill="#234b52"/>
    <g fill="none">
      <path d="M78 117h7m-7 6h7m-7 6h7m-7 6h7"/>
      <path d="M93 119h15v19H93z"/>
      <path d="M75 163h36m-32-4v8m9-8v8m9-8v8m9-8v8"/>
      <path d="M126 126q7 8 0 16m7-22q13 14 0 28" stroke="#7ddac7"/>
    </g>
    <path d="m276 121 13-10h50l-12 10z" fill="#3d626b"/>
    <rect x="276" y="121" width="52" height="32" rx="4" fill="#24444e"/>
    <path d="m328 124 12-10v29l-12 10z" fill="#152f3c"/>
    <path d="M283 132h22m-22 9h15" fill="none"/>
    <circle cx="319" cy="141" r="2.3" fill="#93e4cc" stroke="none"/>
    <path d="M491 121v27c0 14 50 14 50 0v-27" fill="#25444c"/>
    <ellipse cx="516" cy="121" rx="25" ry="8" fill="#46636a"/>
    <path d="M498 151q16 6 35 1" fill="none" stroke="#5c8588"/>
    <circle cx="516" cy="143" r="2" fill="#96e7d4" stroke="none"/>
    <rect x="684" y="108" width="79" height="45" rx="4" fill="#0a1622"/>
    <path d="M719 154v7m9-7v7m-19 1h28" fill="none"/>
    <circle cx="754" cy="148" r="2.3" fill="#efb876" stroke="none"/>
  </g>

  <g text-anchor="middle">
    <g class="name">
      <text x="103" y="201">Bedside sensor</text>
      <text x="309" y="201">Home server</text>
      <text x="516" y="201">BroadLink</text>
      <text x="723" y="201">TV</text>
    </g>
    <g class="detail">
      <text x="103" y="226">Scores stillness</text>
      <text x="309" y="226">Checks Auto mode</text>
      <text x="516" y="226">Sends learned OFF</text>
      <text x="723" y="226">Receives OFF</text>
    </g>
  </g>

  <!-- The optional return path carries measurements to the server. -->
  <path d="M459 298H323q-14 0-14-14v-41" fill="none" stroke="#efb876" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#return)"/>
  <text x="380" y="284" fill="#f3c891" font-size="16" text-anchor="middle">Watts</text>
  <rect x="459" y="261" width="333" height="75" rx="11" fill="#25363d" stroke="#947957"/>
  <path d="M482 286h22v8a11 11 0 0 1-22 0zm5-8v8m12-8v8m-6 19v9" fill="none" stroke="#efb876" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="521" y="292" fill="#ffdaa6" font-size="20" font-weight="650">Optional Shelly meter</text>
  <text x="521" y="316" class="detail">Measures power at the TV outlet</text>
</svg>
